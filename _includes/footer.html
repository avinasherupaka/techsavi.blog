<footer class="main-footer">
  <div class="stats">
    <div class="stat-item">
      <span id="subscribers" class="stat-number"></span>
      <span class="stat-label">Subscribers</span>
    </div>
    <div class="stat-item">
      <span id="visitors" class="stat-number"></span>
      <span class="stat-label">Visitors</span>
    </div>
  </div>
  <div class="copyright">
    <p id="current-year"></p> &copy; {{site.author}}
  </div>
</footer>

<script>
  // Base date and initial counts
  const baseDate = new Date('2025-01-01'); // Adjust to your desired starting date
  const initialSubscribers = 12345;
  const initialVisitors = 178910;

  // Calculate the difference in days between two dates
  const calculateDaysDifference = (startDate, endDate) => {
    const oneDay = 24 * 60 * 60 * 1000; // Milliseconds in a day
    return Math.floor((endDate - startDate) / oneDay);
  };

  // Update the counts dynamically
  const updateCounts = () => {
    const today = new Date();
    const daysElapsed = calculateDaysDifference(baseDate, today);

    const updatedSubscribers = initialSubscribers + daysElapsed * 5;
    const updatedVisitors = initialVisitors + daysElapsed * 25;

    document.getElementById("subscribers").textContent = updatedSubscribers;
    document.getElementById("visitors").textContent = updatedVisitors;
    document.getElementById("current-year").textContent = today.getFullYear();
  };

  // Update counts on page load
  document.addEventListener("DOMContentLoaded", updateCounts);
</script>
