<footer class="main-footer">
  <div class="stats">
    <div class="stat-item">
      <span id="subscribers" class="stat-number"></span>
      <span class="stat-label">Subscribers</span>
    </div>
    <div class="stat-item">
      <span id="visitors" class="stat-number"></span>
      <span class="stat-label">Visitors</span>
    </div>
  </div>
  <div class="copyright">
    <p>{{site.time | date: '%Y'}} &copy; {{site.author}}</p>
  </div>
</footer>

<script>
  // Function to fetch stats from the server
  const fetchStats = async () => {
    try {
      const response = await fetch("/api/stats");
      if (!response.ok) throw new Error("Failed to fetch stats");
      const stats = await response.json();

      // Update the UI
      document.getElementById("subscribers").textContent = stats.subscribers;
      document.getElementById("visitors").textContent = stats.visitors;
    } catch (error) {
      console.error("Error fetching stats:", error);
    }
  };

  // Function to increment visitors count
  const incrementVisitors = async () => {
    try {
      const response = await fetch("/api/visit", { method: "POST" });
      if (!response.ok) throw new Error("Failed to update visitors");
      const stats = await response.json();

      // Update the UI
      document.getElementById("subscribers").textContent = stats.subscribers;
      document.getElementById("visitors").textContent = stats.visitors;
    } catch (error) {
      console.error("Error updating visitors:", error);
    }
  };

  // Initialize the stats on page load
  document.addEventListener("DOMContentLoaded", () => {
    fetchStats();
    incrementVisitors();
    document.getElementById("current-year").textContent = new Date().getFullYear();
  });
</script>
